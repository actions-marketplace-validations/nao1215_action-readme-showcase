# The binary under test is built from this checkout once per run and put first
# on PATH, so every spec here exercises the code in the working tree.
subject:
  name: readme-showcase
  artifact: bin/readme-showcase
  build:
    command: "go build -o ${artifact} ."
    cwd: "../.."
profiles:
  # make coverage: a binary that writes runtime coverage to GOCOVERDIR, which
  # reaches it from the caller's environment. (Restating it here as
  # GOCOVERDIR: "${env:GOCOVERDIR}" passes the text unexpanded in atago v0.26.0.)
  cover:
    build:
      command: "go build -cover -covermode=atomic -coverpkg=./... -o ${artifact} ."
      cwd: "../.."
