version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
    - whitespace
  settings:
    misspell:
      locale: US
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The program reads and writes the paths its user names (config, README,
      # cards), and the files are committed to a repository, so they keep the
      # usual 0644/0755 modes.
      - linters:
          - gosec
        text: "G(301|302|304|306|703)"
      # Tests write fixtures into t.TempDir() and read files they just wrote.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
