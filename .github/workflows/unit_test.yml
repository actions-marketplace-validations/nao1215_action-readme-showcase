name: UnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    name: Unit test (${{ matrix.os }}, Go ${{ matrix.go }})
    # "1.26" is the floor go.mod declares; "stable" is the newest release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26", "stable"]
        exclude:
          - os: macos-latest
            go: "1.26"
          - os: windows-latest
            go: "1.26"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run unit tests
        run: go test -race -cover ./...
